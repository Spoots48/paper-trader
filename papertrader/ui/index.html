<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paper Trader · Command Center</title>
<style>
:root{
  --bg:#f5f5f3; --panel:#ffffff; --sidebar:#ecece9; --ink:#1c1c1e; --muted:#6c6c70; --faint:#9a9a9e;
  --line:#e2e2de; --line-strong:#d1d1cc; --hover:#f0f0ec;
  --accent:#2d6a4f; --accent-soft:#e3efe8; --warn:#9a6700; --warn-soft:#fbf1dc; --bad:#b42318; --bad-soft:#fbe7e5;
  --info:#2458a6; --info-soft:#e4ecf8;
  --s-primary:#2d6a4f; --s-research:#6d4fc2; --s-spy:#5b7083; --s-cash:#a3a3a3; --s-daytrade:#c2410c;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.04),0 1px 1px rgba(0,0,0,.03);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141415; --panel:#1d1d1f; --sidebar:#19191a; --ink:#f2f2f3; --muted:#a0a0a6; --faint:#6f6f75;
    --line:#2c2c2f; --line-strong:#3a3a3e; --hover:#242427;
    --accent:#6fc59a; --accent-soft:#1f3329; --warn:#e3b341; --warn-soft:#352b14; --bad:#ff7b72; --bad-soft:#3b1d1b;
    --info:#79a7f0; --info-soft:#1c2a40;
    --s-primary:#6fc59a; --s-research:#a78bfa; --s-spy:#94a8ba; --s-cash:#6f6f75; --s-daytrade:#fb923c;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
    --bg:#141415; --panel:#1d1d1f; --sidebar:#19191a; --ink:#f2f2f3; --muted:#a0a0a6; --faint:#6f6f75;
    --line:#2c2c2f; --line-strong:#3a3a3e; --hover:#242427;
    --accent:#6fc59a; --accent-soft:#1f3329; --warn:#e3b341; --warn-soft:#352b14; --bad:#ff7b72; --bad-soft:#3b1d1b;
    --info:#79a7f0; --info-soft:#1c2a40;
    --s-primary:#6fc59a; --s-research:#a78bfa; --s-spy:#94a8ba; --s-cash:#6f6f75; --s-daytrade:#fb923c; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:212px 1fr;min-height:100vh}
aside{background:var(--sidebar);border-right:1px solid var(--line);padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center}
.brand b{font-size:15px;letter-spacing:-.01em}
.brand small{display:block;color:var(--muted);font-size:11px;margin-top:-2px}
.nav button{all:unset;display:flex;align-items:center;gap:10px;width:100%;padding:7px 10px;border-radius:8px;color:var(--ink);cursor:pointer;font-size:13.5px;box-sizing:border-box}
.nav button:hover{background:var(--hover)}
.nav button.on{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.nav svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:1.7;flex:none}
.nav button.on svg{stroke:var(--accent)}
.side-foot{margin-top:auto;padding:10px;color:var(--muted);font-size:11.5px;line-height:1.45}
main{min-width:0;padding:22px 28px 60px}
.top{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.top h1{font-size:22px;letter-spacing:-.02em;margin:0}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .spacer{flex:1}
.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:12.5px;font-weight:600;background:var(--panel);border:1px solid var(--line)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.dot.ok{background:#34c759}.dot.warn{background:#ff9f0a}.dot.bad{background:#ff3b30}
.dot.pulse{animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(52,199,89,.55)}70%{box-shadow:0 0 0 7px rgba(52,199,89,0)}100%{box-shadow:0 0 0 0 rgba(52,199,89,0)}}
.btn{all:unset;cursor:pointer;padding:6px 13px;border-radius:8px;font-size:13px;font-weight:600;background:var(--panel);border:1px solid var(--line-strong);color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1f17}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1f17}}
.btn[disabled]{opacity:.45;pointer-events:none}
.menu{position:relative}
.menu .pop{display:none;position:absolute;right:0;top:36px;background:var(--panel);border:1px solid var(--line-strong);border-radius:10px;padding:6px;min-width:230px;z-index:20;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.menu.open .pop{display:block}
.pop button{all:unset;display:block;width:100%;box-sizing:border-box;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:13px}
.pop button:hover{background:var(--hover)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.banner{padding:10px 14px;border-radius:10px;margin-bottom:16px;font-size:13px;border:1px solid var(--line)}
.banner.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.banner.info{background:var(--info-soft);border-color:transparent;color:var(--info)}
.banner.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:13px;font-weight:600;color:var(--muted);margin:0 0 10px;letter-spacing:.01em}
.card h3{font-size:14px;margin:0 0 8px}
.kpi .label{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;font-weight:600}
.kpi .sw{width:10px;height:10px;border-radius:3px}
.kpi .val{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.kpi .chg{font-size:13px;font-variant-numeric:tabular-nums}
.pos{color:var(--accent)}.neg{color:var(--bad)}.mut{color:var(--muted)}
.kpi .foot{color:var(--muted);font-size:12px;margin-top:6px}
.two{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.seg{display:inline-flex;background:var(--sidebar);border:1px solid var(--line);border-radius:9px;padding:2px}
.seg button{all:unset;cursor:pointer;padding:4px 12px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.chart{width:100%;position:relative}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 6px 24px rgba(0,0,0,.12);white-space:nowrap;display:none;z-index:5;font-variant-numeric:tabular-nums}
.progress{position:relative;height:8px;background:var(--line);border-radius:99px;margin:26px 4px 30px}
.progress .fill{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
.progress .mk{position:absolute;top:-22px;transform:translateX(-50%);font-size:11px;color:var(--muted);text-align:center;white-space:nowrap}
.progress .mk::after{content:"";display:block;width:2px;height:14px;background:var(--line-strong);margin:3px auto 0}
.progress .mk.done{color:var(--accent);font-weight:600}
.progress .mk.done::after{background:var(--accent)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;background:var(--panel);position:sticky;top:0}
tr:last-child td{border-bottom:0}
td.wrap{white-space:normal;min-width:260px;max-width:520px}
td.num,th.num{text-align:right}
.badge{display:inline-block;padding:1px 8px;border-radius:6px;font-size:11.5px;font-weight:700;letter-spacing:.02em}
.b-buy{background:var(--accent-soft);color:var(--accent)}.b-sell{background:var(--bad-soft);color:var(--bad)}
.b-skip{background:var(--hover);color:var(--muted)}.b-info{background:var(--info-soft);color:var(--info)}
.b-warn{background:var(--warn-soft);color:var(--warn)}
.list{display:flex;flex-direction:column}
.dec{padding:12px 4px;border-bottom:1px solid var(--line)}
.dec:last-child{border-bottom:0}
.dec .h{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.dec .t{font-weight:650}
.dec .r{color:var(--ink);margin-top:3px}
.dec .m{color:var(--muted);font-size:12px;margin-top:3px}
details summary{cursor:pointer;color:var(--info);font-size:12.5px;margin-top:6px;list-style:none}
details summary::-webkit-details-marker{display:none}
.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 16px;margin-top:8px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.kv b{color:var(--ink);font-weight:600}
.news{margin:8px 0 0;padding:0;list-style:none}
.news li{padding:6px 0;border-top:1px dashed var(--line);font-size:12.5px}
.news a{color:var(--info);text-decoration:none}
.news .ts{color:var(--muted);font-size:11.5px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.filters input,.filters select{font:inherit;font-size:13px;padding:5px 9px;border-radius:8px;border:1px solid var(--line-strong);background:var(--panel);color:var(--ink)}
.empty{color:var(--muted);padding:18px 4px;text-align:center}
pre.log{background:var(--sidebar);border:1px solid var(--line);border-radius:10px;padding:12px;font:11.5px/1.5 ui-monospace,Menlo,monospace;max-height:420px;overflow:auto;white-space:pre-wrap;margin:0}
.prose{max-width:820px}
.prose p,.prose li{color:var(--ink)}
.prose h3{margin-top:22px}
.stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px}
.stat-row:last-child{border-bottom:0}
.stat-row span:first-child{color:var(--muted)}
.toast{position:fixed;bottom:18px;right:18px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;max-width:420px;z-index:50}
.toast.show{opacity:1}
@media (max-width: 1100px){.two{grid-template-columns:1fr}}
@media (max-width: 760px){.app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;overflow-x:auto;padding:8px}.brand,.side-foot{display:none}.nav{display:flex;gap:2px}.nav button{width:auto;white-space:nowrap}main{padding:16px}.kpis{grid-template-columns:1fr}}

.nav .sec{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;padding:14px 10px 4px}
.hero{font-size:15.5px;line-height:1.6;padding:18px 20px}
.hero p{margin:0 0 8px}.hero p:last-child{margin:0}
.hero .big{font-size:18px;font-weight:650;margin-bottom:10px}
.score{display:flex;flex-direction:column;gap:2px}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;padding:14px 4px;border-bottom:1px solid var(--line);align-items:center}
.srow:last-child{border-bottom:0}
.srow .nm{font-weight:650;font-size:15px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.srow .ds{color:var(--muted);font-size:13px;grid-column:1}
.srow .vl{font-size:24px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums;grid-row:1 / span 2;grid-column:2}
.srow .vl small{display:block;font-size:13px;font-weight:600}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;background:var(--hover);color:var(--muted)}
.chip.main{background:var(--accent-soft);color:var(--accent)}
.feed{display:flex;flex-direction:column}
.fi{display:grid;grid-template-columns:92px 1fr;gap:12px;padding:12px 2px;border-bottom:1px solid var(--line)}
.fi:last-child{border-bottom:0}
.fi .tm{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;line-height:1.35}
.fi .tx{font-size:14px;line-height:1.5}
.fi .who{font-size:11.5px;color:var(--muted);margin-top:2px}
.ico{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:6px;font-size:12px;font-weight:800;margin-right:6px;vertical-align:-3px}
.ico.buy{background:var(--accent-soft);color:var(--accent)}.ico.sell{background:var(--bad-soft);color:var(--bad)}.ico.info{background:var(--info-soft);color:var(--info)}
.steps{counter-reset:st;list-style:none;padding:0;margin:0}
.steps li{counter-increment:st;position:relative;padding:4px 0 14px 44px;line-height:1.6}
.steps li::before{content:counter(st);position:absolute;left:0;top:2px;width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center}
.gl dt{font-weight:650;margin-top:10px}.gl dd{margin:2px 0 0;color:var(--muted)}
.own{padding:10px 0;border-bottom:1px solid var(--line)}.own:last-child{border-bottom:0}

/* ---- neon trading-terminal theme (always dark) ---- */
:root:not(#_){
  --bg:#07060a; --panel:#0e0b13; --sidebar:#0a080e; --ink:#f4eaf2; --muted:#9c8c9a; --faint:#5e5260;
  --line:#2a1d2b; --line-strong:#3d2940; --hover:#1a1220;
  --accent:#ff2d95; --accent-soft:#3a0f26; --warn:#ffb020; --warn-soft:#33240a; --bad:#ff4d6d; --bad-soft:#3a1019;
  --info:#8ab4ff; --info-soft:#141d33; --gain:#2dff8f; --gain-soft:#0c2b1c;
  --s-daytrade:#ff2d95; --s-crypto:#22e0ff; --s-primary:#2dff8f; --s-research:#b28dff; --s-spy:#8fa3b8; --s-cash:#5e5260;
  --shadow:none; --radius:6px;
}
body{font-family:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;font-size:13px;letter-spacing:.01em;
  background:radial-gradient(1200px 600px at 70% -10%,#2a0a1e 0%,transparent 60%),var(--bg)}
.pos{color:var(--gain)} .neg{color:var(--bad)}
.card{border-color:var(--line-strong);background:linear-gradient(180deg,#120d18,#0c0910)}
.card h2{text-transform:uppercase;letter-spacing:.12em;font-size:11px;color:var(--muted)}
.card h2::before{content:"// ";color:var(--accent)}
.brand .logo{background:var(--accent);box-shadow:0 0 18px rgba(255,45,149,.6)}
.nav button.on{background:var(--hover);box-shadow:inset 2px 0 0 var(--accent)}
.btn.primary{color:#12060c}
.badge.b-buy{background:var(--gain-soft);color:var(--gain)}
.ico.buy{background:var(--gain-soft);color:var(--gain)}
.chip.main{background:var(--accent-soft);color:var(--accent)}
.top h1{text-transform:uppercase;letter-spacing:.14em;font-size:18px}
/* command center */
.cc-strip{display:flex;gap:22px;align-items:center;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line-strong);border-radius:var(--radius);
  background:#0b0810;margin-bottom:12px;font-size:12px}
.cc-strip .k{color:var(--muted);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;display:block}
.cc-strip .v{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.live{display:inline-flex;align-items:center;gap:6px;color:var(--accent);font-weight:800;letter-spacing:.16em;font-size:11px}
.live::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);animation:blink 1.6s infinite}
@keyframes blink{50%{opacity:.35}}
.paper{border:1px solid var(--warn);color:var(--warn);padding:2px 8px;border-radius:4px;font-size:10.5px;letter-spacing:.14em;font-weight:800}
.cc-grid{display:grid;gap:12px}
.cc-stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.stat{padding:12px 14px}
.stat .k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stat .v{font-size:28px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .s{font-size:11.5px;color:var(--muted);margin-top:2px}
.glow-pink{color:#ffd2e8;text-shadow:0 0 16px rgba(255,45,149,.55)}
.glow-green{color:var(--gain);text-shadow:0 0 16px rgba(45,255,143,.45)}
.glow-red{color:var(--bad);text-shadow:0 0 16px rgba(255,77,109,.45)}
.cc-main{grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.term{font-size:12px;line-height:1.55;max-height:330px;overflow:auto;padding-right:4px}
.term .ln{display:grid;grid-template-columns:62px 34px 1fr;gap:8px;padding:3px 0;border-bottom:1px dashed #1c1320}
.term .t{color:var(--faint)} .term .b{font-weight:800}
.term .buy{color:var(--gain)} .term .sell{color:var(--bad)} .term .info{color:var(--info)} .term .win{color:var(--gain);font-weight:800} .term .loss{color:var(--bad);font-weight:800}
.ob{font-size:12px;font-variant-numeric:tabular-nums}
.ob .row{display:grid;grid-template-columns:70px 1fr 70px;gap:8px;align-items:center;padding:2px 0;position:relative}
.ob .bar{height:14px;border-radius:2px}
.ob .ask .bar{background:linear-gradient(90deg,transparent,rgba(255,77,109,.45))}
.ob .bid .bar{background:linear-gradient(90deg,transparent,rgba(45,255,143,.40))}
.ob .mid{font-size:18px;font-weight:800;text-align:center;padding:6px 0;color:#fff}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{border:1px solid var(--line-strong);border-radius:var(--radius);padding:12px;background:#0c0910;cursor:pointer;position:relative}
.tile:hover{border-color:var(--accent)}
.tile.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent),0 0 22px rgba(255,45,149,.25)}
.tile .nm{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:800}
.tile .bal{font-size:20px;font-weight:800;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.tile .dot2{position:absolute;top:12px;right:12px;width:8px;height:8px;border-radius:50%}
.hero2{font-family:-apple-system,BlinkMacSystemFont,system-ui,sans-serif;font-size:14px;line-height:1.6}
.hero2 p{margin:0 0 6px}
@media (max-width:1100px){.cc-main{grid-template-columns:1fr}}

/* ---- daily reports ---- */
.dr{border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0;background:rgba(255,255,255,.015);animation:fadeUp .3s ease both}
.dr summary{display:flex;gap:8px;align-items:center;cursor:pointer;list-style:none}
.dr summary::-webkit-details-marker{display:none}
.dr[open] summary{margin-bottom:6px}
.dr-row{display:grid;grid-template-columns:1fr auto 90px;gap:10px;padding:5px 0;border-top:1px dashed var(--line);font-size:13px}
.dr-row b{text-align:right}
/* ---- motion ---- */
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes flashUp{0%{background:rgba(45,255,143,.28)}100%{background:transparent}}
@keyframes flashDown{0%{background:rgba(255,77,109,.30)}100%{background:transparent}}
@keyframes glowIn{0%{background:rgba(255,45,149,.22);transform:translateX(-8px);opacity:0}30%{opacity:1;transform:none}100%{background:transparent}}
@keyframes draw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes shimmer{0%{background-position:-200px 0}100%{background-position:200px 0}}
#view.enter > *{animation:fadeUp .35s ease both}
#view.enter > *:nth-child(2){animation-delay:.04s}#view.enter > *:nth-child(3){animation-delay:.08s}#view.enter > *:nth-child(4){animation-delay:.12s}#view.enter > *:nth-child(5){animation-delay:.16s}
.flash-up{animation:flashUp 1.4s ease-out;border-radius:4px}
.flash-down{animation:flashDown 1.4s ease-out;border-radius:4px}
.term .ln.new{animation:glowIn 2.4s ease-out}

.card{transition:border-color .2s ease}
.card:hover{border-color:#5a3a5e}
.chart path.anim{stroke-dasharray:var(--len);animation:draw 1.1s ease-out both}
.pill.busy{background:linear-gradient(90deg,#1a1220 0%,#3a1430 50%,#1a1220 100%);background-size:400px 100%;animation:shimmer 1.6s linear infinite}
.sfx{min-width:34px;text-align:center}
.ob .mid{transition:color .3s}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></div>
      <div><b>PAPER TRADER</b><small>command center · paper money</small></div>
    </div>
    <div class="nav" id="nav"></div>
    <div class="side-foot">Paper trading only.<br>No real money, no brokerage.<br><span id="gen"></span></div>
  </aside>
  <main>
    <div class="top">
      <div>
        <h1 id="title">Overview</h1>
        <div class="sub" id="subtitle"></div>

  </main>
</div>
<div class="tip" id="tip"></div>
<div class="toast" id="toast"></div>
<script>
/*__STATE__*/
const LIVE = !window.__STATE__;
const OPEN = new Set();
const S = {state: window.__STATE__ || null, book: 'primary', view: localGet('view') || 'home', decFilter: {q: '', action: 'major'}, log: []};
const $ = s => document.querySelector(s);
function localGet(k){ try { return localStorage.getItem('pt.'+k); } catch(e){ return null; } }
function localSet(k,v){ try { localStorage.setItem('pt.'+k, v); } catch(e){} }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money = (x, sign) => x == null || isNaN(x) ? '—' : (sign ? (x >= 0 ? '+' : '−') : (x < 0 ? '−' : '')) + '$' + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const pct = (x, digits=2) => x == null || isNaN(x) ? '—' : (x >= 0 ? '+' : '−') + (Math.abs(x) * 100).toFixed(digits) + '%';
const dd = x => !x ? '0.00%' : '−' + (Math.abs(x) * 100).toFixed(2) + '%';
const cls = x => x == null ? 'mut' : (x > 0 ? 'pos' : (x < 0 ? 'neg' : 'mut'));
const num = (x, d=4) => x == null ? '—' : Number(x).toLocaleString(undefined, {maximumFractionDigits: d});
function when(iso){
  if (!iso) return '—';
  const d = new Date(iso.replace(' ', 'T'));
  if (isNaN(d)) return esc(iso);
  const et = d.toLocaleString('en-US', {timeZone: 'America/New_York', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit'});
  return et + ' ET';
}
function ago(iso){
  if (!iso) return 'never';
  const s = (Date.now() - new Date(iso).getTime()) / 1000;
  if (s < 90) return 'just now';
  if (s < 3600) return Math.round(s / 60) + ' min ago';
  if (s < 86400) return Math.round(s / 3600) + ' h ago';
  return Math.round(s / 86400) + ' d ago';
}
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3500); }

const ICONS = {
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  feed: '<path d="M4 6h16M4 12h16M4 18h10"/>',
  own: '<circle cx="12" cy="12" r="9"/><path d="M12 7v10M9 9.5c0-1.2 1.3-2 3-2s3 .8 3 2-1.3 1.8-3 2.2-3 1-3 2.3 1.3 2 3 2 3-.8 3-2"/>',
  how: '<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14"/><path d="M12 17h.01"/>',
  overview: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',
  holdings: '<path d="M4 7h16v12H4z"/><path d="M8 7V5h8v2"/>',
  activity: '<polyline points="3 12 7 12 10 5 14 19 17 12 21 12"/>',
  decisions: '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>',
  reports: '<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="14 3 14 9 20 9"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="13" y2="17"/>',
  backtest: '<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>',
  system: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  method: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-4"/><path d="M12 8h.01"/>'
};
const VIEWS = [['home','Command center'],['feed','Activity'],['own','What it owns'],['reports','Reports'],['how','How it works'],
  ['overview','Detailed numbers'],['decisions','Decision log'],['activity','Trades & orders'],['holdings','Positions table'],['backtest','Past-data tests'],['system','System'],['method','Rules (technical)']];
const MAIN_VIEWS = 5;


// ---------------------------------------------------------------- plain-language layer
const BOT = {
  daytrade: {name: 'Day trader', tag: 'Main bot', main: true, blurb: 'Buys a few fast-moving stocks each morning and sells everything before the market closes.'},
  primary: {name: 'Index fund + safety switch', tag: 'Comparison', blurb: 'Just owns the whole S&P 500 (via the SPY fund); switches to cash if the market turns bad.'},
  research: {name: 'Swing trader', tag: 'Comparison', blurb: 'Holds strong stocks for days or weeks instead of minutes.'},
  crypto2: {name: 'Crypto odds bot v2', tag: 'New', blurb: 'Small bets on Polymarket Bitcoin/Ethereum up-or-down markets, only when live Binance prices and the market odds together point to an edge bigger than the fees.'},
  mm: {name: 'Market maker', tag: 'New', blurb: 'Posts its own buy offers on both "Up" and "Down" so the pair costs under $1; if both get filled it pockets the difference plus fee rebates. Risk: only one side fills.'},
  crypto: {name: 'Crypto odds bot v1', tag: 'Retired', retired: true, blurb: 'Lost 33% on day one: its math priced the wrong kind of bet. Stopped; record kept.'},
};
const TAG = {daytrade: 'DT', mm: 'MM', crypto2: 'P2', crypto: 'P1', primary: 'IX', research: 'SW'};
const botName = id => (BOT[id] || {}).name || id;
const co = t => { const n = (S.state.names || {})[t]; return n ? `${esc(n)} <span class="mut">(${esc(t)})</span>` : esc(t); };
const coTxt = t => { const n = (S.state.names || {})[t]; return n ? `${n} (${t})` : t; };
function tparse(x){ if (!x) return null; const d = new Date(String(x).slice(0, 25).replace(' ', 'T')); return isNaN(d) ? null : d; }
function tfmt(x){ const d = tparse(x); if (!d) return ''; return d.toLocaleString('en-US', {timeZone: 'America/New_York', weekday: 'short', month: 'short', day: 'numeric'}) + '<br>' + d.toLocaleString('en-US', {timeZone: 'America/New_York', hour: 'numeric', minute: '2-digit'}) + ' ET'; }
function dayName(iso){ const d = new Date(iso + 'T12:00:00Z'); return d.toLocaleDateString('en-US', {weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC'}); }

const WHY_BUY = {
  ORB_BREAKOUT: 'its price jumped above its early-morning high while trading was unusually busy',
  MOMENTUM: 'it has been one of the strongest stocks over the past 6 months and is still rising',
  EARNINGS_GAP: 'it jumped after good earnings news, on heavy trading',
  RESIDUAL: 'to put spare cash into the whole market',
  PM_ENTRY: 'live prices said this outcome was more likely than the odds on Polymarket, by more than the fees',
  MM_FILL: 'someone sold into the market maker\'s standing offer (it collects a fee rebate instead of paying a fee)'};
const WHY_SELL = {
  STOP: 'its price fell to the safety stop, so the loss was kept small',
  STOP_GAP: 'its price dropped straight through the safety stop',
  CLOSE_EXIT: 'the trading day ended (a day trader never holds overnight)',
  TIME_EXIT: 'it had been held for the maximum time allowed',
  MOMENTUM_EXIT: 'it was no longer one of the strongest stocks',
  EARNINGS_AVOID: 'it reports earnings soon, which can cause big surprise moves',
  REGIME_OFF: 'the overall market looked risky, so it moved to cash',
  DD_HALT: 'losses reached the safety limit, so it stopped trading',
  FUNDING: 'to free up cash for a new purchase', REBALANCE: 'to keep the mix on target',
  PM_WIN: 'the bet settled in our favor', PM_LOSS: 'the bet settled against us'};

function events(){
  const out = [];
  (S.state.books || []).forEach(b => {
    (b.fills || []).forEach(f => {
      let text;
      if (f.side === 'BUY') text = `<span class="ico buy">↑</span>Bought <b>${money(f.qty * f.fill_price)}</b> of ${co(f.ticker)} at ${money(f.fill_price)} a share, because ${WHY_BUY[f.reason_code] || esc(f.reason)}.`;
      else {
        const pnl = f.realized_pnl;
        const res = pnl == null ? '' : ` <b class="${cls(pnl)}">${pnl >= 0 ? 'Made' : 'Lost'} ${money(Math.abs(pnl))}</b>.`;
        text = `<span class="ico sell">↓</span>Sold ${co(f.ticker)} at ${money(f.fill_price)} a share, because ${WHY_SELL[f.reason_code] || esc(f.reason)}.${res}`;
      }
      out.push({t: tparse(f.price_time), time: f.price_time, bot: b.id, text});
    });
    (b.decisions || []).filter(d => d.reason_code === 'DAY_SELECTION').forEach(d => {
      const list = ((d.metrics || {}).candidates || []);
      const txt = list.length ? `Picked <b>${list.length} stocks to watch</b> today (the busiest, rising ones): ${list.slice(0, 6).map(t => esc(coTxt(t))).join(', ')}${list.length > 6 ? ', …' : ''}. It buys any that break above their early high.`
                              : 'No stocks met the rules this morning, so it will sit in cash today.';
      out.push({t: tparse(d.data_through), time: d.data_through, bot: b.id, text: `<span class="ico info">👀</span>${txt}`});
    });
  });
  return out.filter(e => e.t).sort((a, b) => b.t - a.t);
}

function feedHtml(list, empty){
  if (!list.length) return `<div class="empty">${empty}</div>`;
  return `<div class="feed">${list.map(e => `<div class="fi"><div class="tm">${tfmt(e.time)}</div><div><div class="tx">${e.text}</div><div class="who">${esc(botName(e.bot))}</div></div></div>`).join('')}</div>`;
}

function nowSummary(){
  const st = S.state, cal = st.calendar, b = book('daytrade');
  const today = cal.today_et, start = (b.experiment || {}).start_date;
  const lines = [];
  lines.push(cal.market_open_now ? 'The stock market is <b>open</b> right now (it closes at 4:00 PM Eastern).'
                                 : 'The stock market is <b>closed</b> right now. It\'s open weekdays 9:30 AM – 4:00 PM Eastern.');
  if (b.frozen){
    if (start && start > today) lines.push(`The day trader starts on <b>${dayName(start)}</b> when the market opens.`);
    else {
      const sel = (b.decisions || []).find(d => d.reason_code === 'DAY_SELECTION' && d.session === today);
      const todays = (b.fills || []).filter(f => f.session === today);
      const buys = todays.filter(f => f.side === 'BUY').length;
      const owns = (b.positions || []).map(p => coTxt(p.ticker));
      if (sel) lines.push(`This morning it picked <b>${((sel.metrics || {}).candidates || []).length} stocks</b> to watch and has made <b>${buys} purchase${buys === 1 ? '' : 's'}</b> so far today.`);
      const sold = todays.filter(f => f.side === 'SELL'), pnl = sold.reduce((a, f) => a + (f.realized_pnl || 0), 0);
      if (sold.length) lines.push(`Today so far: <b>${sold.filter(f => (f.realized_pnl || 0) > 0).length} of ${sold.length}</b> finished trades made money. Result: <b class="${cls(pnl)}">${pnl >= 0 ? 'up' : 'down'} ${money(Math.abs(pnl))}</b>.`);
      const ds = b.day_state || {};
      if (ds.session === today && ds.cash_at_open && ds.buys_used >= ds.cash_at_open * 0.97 && cal.market_open_now)
        lines.push('It has already used all of today\'s money, so it <b>can\'t buy anything else today</b>. In a normal cash account, money from a sale can\'t be reused until the next day. It starts fresh tomorrow at 9:35 AM.');
      else if (cal.market_open_now) lines.push('It picks which stocks to watch at 9:35 AM, after the first five minutes of trading. Results show up here within about 20 minutes.');
      if (owns.length) lines.push(`Right now it owns: <b>${owns.map(esc).join(', ')}</b>.`);
      else if (cal.market_open_now && todays.length) lines.push('Right now it owns <b>nothing</b>: every trade it made today has already been closed.');
      else if (sel || !cal.market_open_now) lines.push('Right now it owns <b>nothing</b>. It\'s all in cash, which is normal outside market hours.');
    }
  }
  lines.push('<span class="mut">Everything here is pretend money. No real stocks are bought or sold.</span>');
  return lines.map(l => `<p>${l}</p>`).join('');
}

function botValue(b){
  const cash0 = S.state.experiment.starting_cash, p = b.perf || {};
  return b.live_equity != null ? b.live_equity : (p.equity ?? cash0);
}


function termLines(limit){
  const out = [];
  (S.state.books || []).forEach(b => {
    (b.fills || []).forEach(f => {
      const d = tparse(f.price_time) || tparse(f.recorded_at);
      let cls_ = f.side === 'BUY' ? 'buy' : 'sell', act = f.side, txt;
      if (f.reason_code === 'PM_WIN'){ cls_ = 'win'; act = 'WIN'; }
      if (f.reason_code === 'PM_LOSS'){ cls_ = 'loss'; act = 'LOSS'; }
      const amt = f.qty * f.fill_price, pnl = f.realized_pnl;
      if (f.side === 'BUY') txt = `<span class="${cls_} b">${act}</span> ${esc(f.ticker)} ${money(amt)} @ ${f.fill_price < 2 ? f.fill_price.toFixed(3) : money(f.fill_price)}`;
      else txt = `<span class="${cls_} b">${act}</span> ${esc(f.ticker)}${pnl != null ? ` <span class="${pnl >= 0 ? 'win' : 'loss'}">${money(pnl, true)}</span>` : ''} <span class="mut">${esc((WHY_SELL[f.reason_code] || '').split(',')[0])}</span>`;
      const isNew = S.newKeys && S.newKeys.has(b.id + ':' + f.fill_id);
      out.push({d, html: `<div class="ln ${isNew ? 'new' : ''}"><span class="t">${d ? d.toLocaleTimeString('en-US', {timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false}) : ''}</span><span class="info">${TAG[b.id] || '··'}</span><span>${txt}</span></div>`});
    });
    (b.decisions || []).filter(x => x.reason_code === 'DAY_SELECTION' || x.reason_code === 'PM_SCAN').slice(0, 30).forEach(x => {
      const d = tparse(x.reason_code === 'PM_SCAN' ? x.created_at : x.data_through);
      const txt = x.reason_code === 'PM_SCAN' ? `SCAN ${esc(x.reason.split(';')[0])}` : `SELECT ${((x.metrics || {}).candidates || []).length} stocks in play: ${esc(((x.metrics || {}).candidates || []).slice(0, 6).join(' '))}`;
      out.push({d, html: `<div class="ln"><span class="t">${d ? d.toLocaleTimeString('en-US', {timeZone: 'America/New_York', hour: '2-digit', minute: '2-digit', hour12: false}) : ''}</span><span class="info">${TAG[b.id] || '··'}</span><span class="mut">${txt}</span></div>`});
    });
  });
  return out.filter(x => x.d).sort((a, b) => b.d - a.d).slice(0, limit).map(x => x.html).join('');
}

function obPanel(){
  const f = S.state.live_feed || {}, pm = f.pm;
  if (!pm) return '<div class="empty">Live market feed loads a few seconds after the app opens.</div>';
  const mx = Math.max(1, ...pm.asks.map(a => a[1]), ...pm.bids.map(b => b[1]));
  const row = (p, sz, cl) => `<div class="row ${cl}"><span>${(p * 100).toFixed(1)}¢</span><div class="bar" style="width:${Math.max(4, sz / mx * 100)}%"></div><span style="text-align:right">${Math.round(sz).toLocaleString()}</span></div>`;
  const mid = pm.asks.length && pm.bids.length ? (pm.asks[0][0] + pm.bids[0][0]) / 2 : null;
  const ends = tparse(pm.ends), left = ends ? Math.max(0, Math.round((ends - Date.now()) / 60000)) : null;
  return `<div class="mut" style="font-size:11.5px;margin-bottom:6px">${esc(pm.title)} · Polymarket · ${left != null ? left + ' min left' : ''}</div>
    <div class="ob">${pm.asks.slice().reverse().map(a => row(a[0], a[1], 'ask')).join('')}
    <div class="mid">UP ${mid != null ? (mid * 100).toFixed(1) + '¢' : '—'} <span class="mut" style="font-size:11px">= ${mid != null ? Math.round(mid * 100) : '—'}% chance Bitcoin ends up</span></div>
    ${pm.bids.map(b => row(b[0], b[1], 'bid')).join('')}</div>
    <p class="mut" style="font-size:11px;margin:8px 0 0">Red = people selling "Up" shares, green = buying. Live, refreshed every 15 s. The bot's paper bets use this same order book.</p>`;
}

function viewHome(){
  const st = S.state, cash0 = st.experiment.starting_cash, f = st.live_feed || {};
  const books = st.books || [];
  const main = book('daytrade');
  const allFills = books.flatMap(b => (b.fills || []).map(x => ({...x, _b: b.id})));
  const closed = allFills.filter(x => x.side === 'SELL' && x.realized_pnl != null && x.sleeve !== 'residual');
  const wins = closed.filter(x => x.realized_pnl > 0).length;
  const today = st.calendar.today_et;
  const tradesToday = allFills.filter(x => x.side === 'BUY' && (x.session === today)).length;
  const totalVal = books.reduce((a, b) => a + botValue(b), 0), totalStart = books.length * cash0;
  const spyB = book('primary'), spy = spyB.live_spy_equity ?? (spyB.perf || {}).spy_equity;
  const mv = botValue(main), mr = mv / cash0 - 1;
  const cl = x => x > 0 ? 'glow-green' : x < 0 ? 'glow-red' : 'glow-pink';
  const clock = new Date().toLocaleTimeString('en-US', {timeZone: 'America/New_York', hour12: false});
  const px = k => f[k] ? `<span data-anim="px-${k}" data-val="${f[k].price}">${money(f[k].price)}</span>` : '—';
  const tiles = books.map(b => {
    const v = botValue(b), r = v / cash0 - 1, m = BOT[b.id] || {};
    const started = (b.experiment || {}).start_date, notYet = started && started > today;
    return `<div class="tile ${S.feedBot === b.id ? 'on' : ''}" data-b="${b.id}" style="${m.retired ? 'opacity:.55' : ''}"><span class="dot2" style="background:${COLORS[b.id]};box-shadow:0 0 10px ${COLORS[b.id]}"></span>
      <div class="nm" style="color:${COLORS[b.id]}">${esc(m.name || b.name)}</div><div class="bal" data-anim="tile-${b.id}" data-val="${v}">${money(v)}</div>
      <div class="${cls(r)}" style="font-size:12px">${notYet ? 'starts ' + esc(started) : `${money(v - cash0, true)} (${pct(r)})`}</div>
      <div class="mut" style="font-size:11px;margin-top:6px;font-family:-apple-system,system-ui">${esc(m.blurb || '')}</div></div>`;
  }).join('') + `<div class="tile" style="cursor:default"><span class="dot2" style="background:var(--s-spy)"></span><div class="nm" style="color:var(--s-spy)">Just buy S&amp;P 500</div>
      <div class="bal">${money(spy ?? cash0)}</div><div class="${cls(spy ? spy - cash0 : 0)}" style="font-size:12px">${spy ? `${money(spy - cash0, true)} (${pct(spy / cash0 - 1)})` : ''}</div>
      <div class="mut" style="font-size:11px;margin-top:6px;font-family:-apple-system,system-ui">The yardstick: a bot is only good if it beats this.</div></div>`;
  $('#view').innerHTML = `
    <div class="cc-strip"><span class="live">LIVE</span><span class="paper">PAPER MONEY</span>
      <div><span class="k">BTC</span><span class="v">${px('BTC')}</span></div><div><span class="k">ETH</span><span class="v">${px('ETH')}</span></div>
      <div><span class="k">SOL</span><span class="v">${px('SOL')}</span></div>
      <div><span class="k">Stock market</span><span class="v ${st.calendar.market_open_now ? 'pos' : 'mut'}">${st.calendar.market_open_now ? 'OPEN' : 'CLOSED'}</span></div>
      <div style="margin-left:auto;text-align:right"><span class="k">New York time</span><span class="v">${clock}</span></div></div>
    <div class="cc-grid cc-stats">

const SFX = {
  ctx: null, on: localGet('sfx') !== 'off',
  init(){ try { this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)(); if (this.ctx.state === 'suspended') this.ctx.resume(); } catch(e){} },
  tone(freq, t0, dur, type = 'sine', vol = 0.08){
    const c = this.ctx; if (!c) return;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, c.currentTime + t0);
    g.gain.setValueAtTime(0.0001, c.currentTime + t0);
    g.gain.exponentialRampToValueAtTime(vol, c.currentTime + t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
    o.connect(g).connect(c.destination); o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + 0.02);
  },
  play(kind){
    if (!this.on) return; this.init(); if (!this.ctx) return;
    if (kind === 'buy'){ this.tone(660, 0, .12, 'triangle'); this.tone(990, .09, .16, 'triangle'); }
    else if (kind === 'win'){ [1046, 1318, 1568, 2093].forEach((f, i) => this.tone(f, i * .07, .22, 'square', .045)); }
    else if (kind === 'loss'){ this.tone(330, 0, .22, 'sine', .09); this.tone(247, .16, .32, 'sine', .08); }
    else if (kind === 'tick'){ this.tone(1800, 0, .035, 'square', .025); }
    else if (kind === 'click'){ this.tone(1200, 0, .025, 'triangle', .03); }
    else if (kind === 'on'){ this.tone(880, 0, .08, 'triangle'); this.tone(1320, .07, .1, 'triangle'); }
  }
};
document.addEventListener('pointerdown', () => SFX.init(), {once: true});

const PREV = {};
function animateValues(){
  document.querySelectorAll('[data-anim]').forEach(el => {
    const k = el.dataset.anim, v = parseFloat(el.dataset.val), fmt = el.dataset.fmt || 'money';
    if (isNaN(v)) return;
    const old = PREV[k];
    PREV[k] = v;
    if (old == null || Math.abs(old - v) < 1e-9) return;
    el.classList.remove('flash-up', 'flash-down'); void el.offsetWidth;
    el.classList.add(v > old ? 'flash-up' : 'flash-down');
    const t0 = performance.now(), dur = 700, f = fmt === 'signed' ? (x => money(x, true)) : fmt === 'int' ? (x => String(Math.round(x))) : (x => money(x));
    const step = now => { const a = Math.min(1, (now - t0) / dur), e = 1 - Math.pow(1 - a, 3); el.textContent = f(old + (v - old) * e); if (a < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}

function fillKeys(st){

function soundForNew(st){
  const keys = fillKeys(st);
  if (!S.seen){ S.seen = new Set(Object.keys(keys)); S.newKeys = new Set(); S.lastSync = (st.scheduler || {}).last_sync && st.scheduler.last_sync.at; return; }
  const fresh = Object.keys(keys).filter(k => !S.seen.has(k));
  S.newKeys = new Set(fresh);
  fresh.slice(0, 4).forEach((k, i) => setTimeout(() => {
    const f = keys[k];
    SFX.play(f.side === 'BUY' ? 'buy' : ((f.realized_pnl || 0) > 0 ? 'win' : 'loss'));
  }, i * 380));
  fresh.forEach(k => S.seen.add(k));
  const ls = (st.scheduler || {}).last_sync && st.scheduler.last_sync.at;
  if (!fresh.length && ls && S.lastSync && ls !== S.lastSync && (st.scheduler.last_sync.restored || []).length) SFX.play('tick');
  S.lastSync = ls;
}

// ---------------------------------------------------------------- chart
function lineChart(el, series, opts = {}){
  const W = el.clientWidth || 700, H = opts.height || 260, P = {l: 56, r: 16, t: 12, b: 28};
  const xs = opts.x;  // array of labels
  const all = series.flatMap(s => s.values.filter(v => v != null));
  if (!all.length){ el.innerHTML = `<div class="empty">${opts.empty || 'No data yet.'}</div>`; return; }
  let lo = Math.min(...all), hi = Math.max(...all);
  const pad = (hi - lo) * 0.12 || Math.max(1, hi * 0.01);
  lo -= pad; hi += pad;
  if (opts.minSpan && hi - lo < opts.minSpan){ const mid = (hi + lo) / 2; lo = mid - opts.minSpan / 2; hi = mid + opts.minSpan / 2; }
  const X = i => P.l + (xs.length === 1 ? 0 : i * (W - P.l - P.r) / (xs.length - 1));
  const Y = v => P.t + (hi - v) * (H - P.t - P.b) / (hi - lo);
  const span = hi - lo, dec = span < 4 ? 2 : span < 40 ? 1 : 0;
  const ticks = 4, grid = [];
  for (let k = 0; k <= ticks; k++){
    const v = lo + (hi - lo) * k / ticks;
    grid.push(`<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${P.l - 8}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)">${opts.fmt ? opts.fmt(v, false, dec) : v.toFixed(dec)}</text>`);
  }
  const nx = Math.min(6, xs.length);
  for (let k = 0; k < nx; k++){
    const i = Math.round(k * (xs.length - 1) / Math.max(1, nx - 1));
    grid.push(`<text x="${X(i)}" y="${H - 8}" text-anchor="middle" font-size="11" fill="var(--muted)">${esc(opts.xfmt ? opts.xfmt(xs[i]) : xs[i])}</text>`);
  }
  const paths = series.map(s => {
    let d = '', pen = false;
    s.values.forEach((v, i) => { if (v == null){ pen = false; return; } d += (pen ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(v).toFixed(1); pen = true; });
    return `<path class="${S.entering && !s.dash ? 'anim' : ''}" d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.width || 2}" stroke-linejoin="round" stroke-linecap="round" ${s.dash ? 'stroke-dasharray="4 4"' : ''}/>`;
  }).join('');
  const base = opts.baseline != null ? `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(opts.baseline)}" y2="${Y(opts.baseline)}" stroke="var(--line-strong)" stroke-dasharray="2 3"/>` : '';
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || 'chart')}">${grid.join('')}${base}${paths}<line class="cur" y1="${P.t}" y2="${H - P.b}" stroke="var(--line-strong)" style="display:none"/><rect x="${P.l}" y="${P.t}" width="${W - P.l - P.r}" height="${H - P.t - P.b}" fill="transparent"/></svg>`;
  const svg = el.querySelector('svg'), tip = $('#tip'), cur = svg.querySelector('.cur');
  svg.onmousemove = e => {
    const r = svg.getBoundingClientRect(), sx = (e.clientX - r.left) * W / r.width;
    const i = Math.max(0, Math.min(xs.length - 1, Math.round((sx - P.l) / ((W - P.l - P.r) / Math.max(1, xs.length - 1)))));
    cur.setAttribute('x1', X(i)); cur.setAttribute('x2', X(i)); cur.style.display = '';
    const rows = series.filter(s => s.values[i] != null).map(s => `<div><span style="color:${s.color}">●</span> ${esc(s.name)}: <b>${opts.fmt ? opts.fmt(s.values[i], true) : s.values[i]}</b></div>`).join('');
    if (!rows){ tip.style.display = 'none'; return; }
    tip.innerHTML = `<div class="mut">${esc(opts.xfmt ? opts.xfmt(xs[i]) : xs[i])}</div>${rows}`;
    tip.style.display = 'block';
    tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 10) + 'px';

const COLORS = {mm: '#ffb020', crypto2: 'var(--s-crypto)', crypto: '#4b6b73', daytrade: 'var(--s-daytrade)', primary: 'var(--s-primary)', research: 'var(--s-research)', spy: 'var(--s-spy)', cash: 'var(--s-cash)'};

// sessions of the experiment window (weekdays; holidays show as flat, none fall in this window)
function windowSessions(){
  const cal = S.state.calendar, out = [];
  const d = new Date(cal.start + 'T12:00:00Z'), end = new Date(cal.end + 'T12:00:00Z');
  const pre = new Date(d); do { pre.setUTCDate(pre.getUTCDate() - 1); } while ([0, 6].includes(pre.getUTCDay()));
  out.push(pre.toISOString().slice(0, 10));
  for (; d <= end; d.setUTCDate(d.getUTCDate() + 1)) if (![0, 6].includes(d.getUTCDay())) out.push(d.toISOString().slice(0, 10));
  return out;
}
function equitySeries(){
  const xs = windowSessions(), cash0 = S.state.experiment.starting_cash;
  const series = [];
  const spyVals = xs.map((_, i) => i === 0 ? cash0 : null);
  const today = S.state.calendar.today_et, ti = xs.indexOf(today);
  (S.state.books || []).forEach(b => {
    const m = Object.fromEntries((b.snapshots || []).map(s => [s.session, s]));
    const vals = xs.map((x, i) => i === 0 ? cash0 : (m[x] ? m[x].equity : null));
    if (ti > 0 && vals[ti] == null && (b.positions || []).length && b.live_equity != null){
      vals[ti] = b.live_equity;  // today's live estimate until the close-out snapshot exists
      if (spyVals[ti] == null && b.live_spy_equity != null) spyVals[ti] = b.live_spy_equity;
    }
    xs.forEach((x, i) => { if (m[x] && m[x].spy_bh_equity != null && spyVals[i] == null) spyVals[i] = m[x].spy_bh_equity; });
    series.push({name: botName(b.id), color: COLORS[b.id] || 'var(--info)', values: vals, width: b.id === 'daytrade' ? 3 : 2});
  });
  series.push({name: 'Just buy the S&P 500', color: COLORS.spy, values: spyVals});
  series.push({name: 'Do nothing', color: COLORS.cash, values: xs.map(() => cash0), dash: true, width: 1.5});
  return {xs, series};
}

    (st.books || []).forEach(b => cr.push([`${esc(b.name)} audit`, b.audit ? (b.audit.chain_ok ? `OK · ${esc(b.audit.detail)}` : '<span class="neg">BROKEN</span>') : '—']));

    ['Last run', hb.at ? `${ago(hb.at)} · ${esc(hb.status)}` : 'never'],

      <div class="chart" id="bt-${p}" style="margin:8px 0 14px"></div>
      ${table([{h: 'Variant ($100 start, costs incl.)'}, {h: 'Total', n: 1}, {h: 'CAGR', n: 1}, {h: 'Max DD', n: 1}, {h: 'Sharpe', n: 1}, {h: 'Stock trades', n: 1}, {h: 'Costs', n: 1}], rows)}
      <p class="mut" style="font-size:12.5px;margin-top:10px">Earnings-gap signal event study (next-open entry, excess vs SPY): n=${es.n ?? 0}, 5-day ${pct(es.excess_5d_mean)} (t=${es.excess_5d_tstat?.toFixed(2)}), 20-day ${pct(es.excess_20d_mean)} (t=${es.excess_20d_tstat?.toFixed(2)}).
      Rolling 30-day windows: the full strategy beat SPY in ${Math.round(d.rolling.pct_windows_beat_spy * 100)}% of ${d.rolling.n_windows} windows; excess-return spread ±${(d.rolling.excess_std * 100).toFixed(1)} pts (1 s.d.).</p></div>`;
  }).join('');
  const dbt = S.state.backtest_daytrade || {};
  const dcard = Object.entries(dbt).map(([k, r]) => `<div class="card" style="margin-top:14px"><h2>Day-trading book · execution on ${k === '1m' ? '1-minute' : '5-minute'} bars · ${esc(r.full.start)} → ${esc(r.full.end)} (${r.full.sessions} sessions)</h2>
      ${table([{h: ''}, {h: 'Total', n: 1}, {h: 'Max DD', n: 1}, {h: 'Up days', n: 1}], [
        ['Day-trading book', `<span class="${cls(r.full.total_return)}">${pct(r.full.total_return, 1)}</span>`, pct(-r.full.max_drawdown, 1), Math.round(r.full.pct_up_days * 100) + '%'],
        ['SPY, same days', `<span class="${cls(r.spy_same_period.total_return)}">${pct(r.spy_same_period.total_return, 1)}</span>`, pct(-r.spy_same_period.max_drawdown, 1), Math.round(r.spy_same_period.pct_up_days * 100) + '%']])}
      <p class="mut" style="font-size:12.5px;margin-top:10px">${r.trades.n_round_trips} trades (${(r.trades.avg_trades_per_day || 0).toFixed(1)}/day), win rate ${Math.round((r.trades.win_rate || 0) * 100)}%, exits: ${esc(Object.entries(r.trades.exit_reasons || {}).map(([a, b]) => a + ' ' + b).join(', '))}. ${k === '5m' ? 'Pre-registered test; 5-minute bars could not tell whether the tight stop was hit before or after entry, and the worst-case assumption decided 80% of trades.' : 'Same rules at the paper\'s 1-minute resolution; the live book runs this way. Very short sample.'}</p></div>`).join('');
  const pc = S.state.pm_calibration;
  const p2 = S.state.pm2_backtest;
  const p2card = p2 && p2.all ? `<div class="card" style="margin-top:14px"><h2>Crypto odds bot v2 · replay on settled markets · ${esc((p2.period_utc || [''])[0].slice(0, 10))} → ${esc((p2.period_utc || ['', ''])[1].slice(0, 10))}</h2>
      ${table([{h: ''}, {h: 'Bets', n: 1}, {h: 'Won', n: 1}, {h: 'Return on money bet', n: 1}], [
        ['All days', p2.all.bets, p2.all.bets ? Math.round(p2.all.win_rate * 100) + '%' : '—', p2.all.bets ? pct(p2.all.return_on_stake, 1) : '—'],
        ['Earlier days (used while building)', p2.in_sample.bets, p2.in_sample.bets ? Math.round(p2.in_sample.win_rate * 100) + '%' : '—', p2.in_sample.bets ? pct(p2.in_sample.return_on_stake, 1) : '—'],
        ['Last 2 days (fresh check)', p2.out_of_sample_last_days.bets, p2.out_of_sample_last_days.bets ? Math.round(p2.out_of_sample_last_days.win_rate * 100) + '%' : '—', p2.out_of_sample_last_days.bets ? pct(p2.out_of_sample_last_days.return_on_stake, 1) : '—']])}
      <p class="mut" style="font-size:12.5px;margin-top:10px">$100 would have ended at ${money(p2.ending_equity_from_100)}. Uses last-trade prices + 1¢ rather than true asks, so real results would be a bit worse. Too few days to prove anything.</p></div>` : '';
  const pcard = pc ? `<div class="card" style="margin-top:14px"><h2>Crypto odds bot · model vs Polymarket's own odds · ${esc((pc.period_utc || [''])[0].slice(0, 10))} → ${esc((pc.period_utc || ['', ''])[1].slice(0, 10))}</h2>
      ${table([{h: ''}, {h: 'Accuracy score (lower = better)', n: 1}], [['Polymarket\'s own odds', pc.brier_market.toFixed(3)], ['Bot\'s fair-value model', pc.brier_model.toFixed(3)]])}
      <p class="mut" style="font-size:12.5px;margin-top:10px">${pc.samples.toLocaleString()} price snapshots from settled markets. The market's odds were more accurate than the model, so most of the "gaps" the bot sees are the model being overconfident, not the market being wrong.
      ${pc.one_bet_per_window ? `Replaying the bot's exact rules: ${pc.one_bet_per_window.n.toLocaleString()} bets, ${Math.round(pc.one_bet_per_window.win_rate * 100)}% won, overall ${pct(pc.one_bet_per_window.return_on_stake, 1)} after fees.` : ''}</p></div>` : '';
  $('#view').innerHTML = dcard + p2card + pcard + `<div class="banner info" style="margin-top:14px">Historical simulation — not live results. Parameters were fixed before this test (see research/PREREGISTRATION.md). News filtering could not be backtested (no free historical archive), and the universe is today's S&P 500 with each stock allowed only after its index-inclusion date.</div>${per}`;
  Object.entries(bt.periods).forEach(([p, d]) => {
    const c = d.curve;
    lineChart($('#bt-' + p), [{name: 'Primary rules', color: 'var(--s-primary)', values: c.regime_gated_spy_only}, {name: 'Research rules', color: 'var(--s-research)', values: c.full_strategy}, {name: 'SPY', color: 'var(--s-spy)', values: c.spy}],
      {x: c.dates, xfmt: s => s.slice(0, 7), fmt: (v, full, d) => full ? money(v) : '$' + v.toFixed(d ?? 0), height: 220, baseline: 100});
  });
}

async function viewSystem(){
  const b = book(), st = S.state, sc = st.scheduler || {};
  const runs = (b.runs || []).slice(0, 60).map(r => [when(r.started_at), `<span class="badge ${r.status === 'OK' ? 'b-buy' : r.status === 'ERROR' ? 'b-sell' : 'b-info'}">${esc(r.status)}</span>`, esc(r.trigger || ''), `<span class="${r.error ? 'neg' : 'mut'}">${esc((r.error || r.summary || '').slice(0, 220))}</span>`]);
  const iss = (b.issues || []).slice(0, 80).map(i => [when(i.occurred_at), `<span class="badge ${['ERROR', 'CRITICAL'].includes(i.severity) ? 'b-sell' : i.severity === 'WARN' ? 'b-warn' : 'b-info'}">${esc(i.severity)}</span>`, esc(i.component), esc(i.ticker || ''), `<span class="mut">${esc(i.message.slice(0, 260))}</span>`]);
  $('#view').innerHTML = `<div class="row" style="justify-content:space-between;margin-bottom:12px">${bookSeg()}</div>
    <div class="grid two"><div class="card"><h2>Scheduler</h2>
      <div class="stat-row"><span>launchd job</span><span>${sc.installed ? 'installed' : 'not installed'} · ${sc.loaded ? 'loaded' : 'not loaded'}</span></div>
      <div class="stat-row"><span>State</span><span>${esc(sc.detail || '—')}</span></div>
      <div class="stat-row"><span>Paused</span><span>${sc.paused ? 'yes' : 'no'}</span></div>
      <div class="stat-row"><span>Last heartbeat</span><span>${sc.heartbeat ? when(sc.heartbeat.at) + ' · ' + esc(sc.heartbeat.status) : '—'}</span></div>
      <p class="mut" style="font-size:12px;margin-top:10px">Runs every 15 minutes while the Mac is on and online; exits immediately when offline or paused. Logs: <code>logs/cycle.log</code> and <code>~/Library/Logs/PaperTradingSim/</code>.</p></div>
      <div class="card"><h2>Integrity</h2>
      <div class="stat-row"><span>Audit hash chain</span><span>${b.audit ? (b.audit.chain_ok ? '<span class="pos">verified</span> · ' + esc(b.audit.detail) : '<span class="neg">broken</span>') : '—'}</span></div>
      <div class="stat-row"><span>Strategy file = frozen</span><span>${b.audit && b.audit.strategy_file_matches_frozen ? '<span class="pos">yes</span>' : (b.audit ? '<span class="neg">no</span>' : '—')}</span></div>
      <div class="stat-row"><span>Frozen at</span><span>${b.experiment ? when(b.experiment.frozen_at) : 'not frozen'}</span></div>
      <div class="stat-row"><span>Strategy SHA-256</span><span class="mut" style="font-size:11px">${b.experiment ? esc(b.experiment.strategy_sha256.slice(0, 20)) + '…' : '—'}</span></div>
      <div class="stat-row"><span>Logged strategy changes</span><span>${(b.changes || []).length}</span></div></div></div>
    ${sc.mode === 'cloud' ? `<div class="card" style="margin-top:14px"><h2>Cloud runs (GitHub Actions)</h2>${table([{h: 'Started'}, {h: 'Trigger'}, {h: 'Status'}, {h: ''}],
      (sc.runs || []).map(r => [when(r.createdAt), esc(r.event), `<span class="badge ${r.conclusion === 'success' ? 'b-buy' : r.conclusion ? 'b-sell' : 'b-info'}">${esc(r.conclusion || r.status)}</span>`, `<a href="${esc(r.url)}" target="_blank" rel="noopener">details</a>`]), 'No cloud runs yet.')}</div>` : ''}
    <div class="card" style="margin-top:14px"><h2>Recent runs</h2>${table([{h: 'Started'}, {h: 'Status'}, {h: 'Trigger'}, {h: 'Summary / error', w: 1}], runs, 'No runs yet.')}</div>
    <div class="card" style="margin-top:14px"><h2>Data & system issues</h2>${table([{h: 'When'}, {h: 'Severity'}, {h: 'Component'}, {h: 'Ticker'}, {h: 'Message', w: 1}], iss, 'No issues logged.')}</div>
    ${LIVE ? '<div class="card" style="margin-top:14px"><h2>Log (tail)</h2><pre class="log" id="log">Loading…</pre></div>' : ''}`;
  bindSeg();
  if (LIVE){ try { const r = await (await fetch('/api/log?lines=150')).json(); const el = $('#log'); if (el){ el.textContent = r.lines.join('\n') || '(empty)'; el.scrollTop = el.scrollHeight; } } catch(e){} }
}

function viewMethod(){
  const st = S.state, strat = st.strategies || {}, p = strat.primary || {}, r = strat.research || {};
  const c = (p.costs || {}), risk = (p.risk || {}), reg = (p.regime || {}), port = (p.portfolio || {}), cat = (r.catalyst || {}), mom = (r.momentum || {});
  const dt_ = strat.daytrade || {}, dP = dt_.portfolio || {}, dS = dt_.selection || {}, dE = dt_.exit || {}, dR = dt_.risk || {};
  $('#view').innerHTML = `<div class="card prose">
    ${dt_.version ? `<h3 style="margin-top:0">Day trading (headline book, $100 from ${esc((book('daytrade').experiment || {}).start_date || '')})</h3>
    <p>Aggressive and intraday: several stocks a day, everything sold by the close. Based on the "stocks in play" opening-range breakout (Zarattini, Barbon &amp; Aziz, 2023).</p>
    <ul><li>09:35 ET: find the ${dS.top_n_by_relative_volume} S&amp;P 500 stocks with the heaviest first-5-minute volume versus their normal (at least ${dS.min_relative_volume}×), whose first 5 minutes closed up.</li>
      <li>Buy any that break above their first-5-minute high: up to ${dP.max_positions} at a time, ${(dP.position_weight * 100).toFixed(0)}% each. Stop at ${(dE.stop_atr_fraction * 100).toFixed(0)}% of the stock's average daily range below entry. Sell whatever is left at the close.</li>
      <li>Cash account: each dollar can be traded once per day (sale proceeds settle the next day). No leverage, no shorts. News can only veto a trade (offerings, investigations, takeover news).</li>
      <li>Risk: a ${(dR.drawdown_pause * 100).toFixed(0)}% drawdown pauses trading for ${dR.pause_sessions} sessions; a ${(dR.drawdown_halt * 100).toFixed(0)}% drawdown stops the book.</li>
      <li>Processed on 1-minute bars, strictly in time order. The cloud runs every ~20 minutes, so trades appear in the app up to ~20 minutes after they happen, priced at the minute they happened.</li></ul>
    <h3>The two original books, both starting with $100 on ${esc(st.calendar.start)}</h3>` : `<h3 style="margin-top:0">Two frozen books, both starting with $100 on ${esc(st.calendar.start)}</h3>`}
    <p><b>Primary</b> keeps only what passed the pre-registered backtest: hold SPY with idle cash (keeping a ${(port.cash_buffer * 100).toFixed(0)}% cash buffer) while SPY is above its ${reg.sma_days}-day average and VIX is below ${reg.vix_risk_off_above} (re-enter below ${reg.vix_risk_on_below}); otherwise hold cash.</p>
    <p><b>Research</b> runs the original pre-registered strategy forward, including the news filter that could not be backtested: up to ${port.max_single_stock_positions} stock positions at ${(port.target_weight * 100).toFixed(0)}% each.</p>
    <ul>
      <li><b>Earnings gaps:</b> S&amp;P 500 stocks that rose ≥${(cat.min_reaction_return * 100).toFixed(0)}% on their earnings reaction day (≥${(cat.min_excess_vs_spy * 100).toFixed(0)}% more than SPY), on ≥${cat.min_volume_ratio}× normal volume, closing in the upper half of the day's range. <i>Must be confirmed</i> by a timestamped earnings headline published before the decision; vetoed on hard negatives (offerings, investigations, restatements, bankruptcy), takeover news, or net-negative tone. Stop ${(cat.stop_max_loss * 100).toFixed(0)}% (or the reaction-day low), ${(cat.trailing_stop * 100).toFixed(0)}% trailing stop, ${cat.max_hold_sessions}-session time exit.</li>
      <li><b>Momentum:</b> up to ${mom.max_positions} of the strongest 6-month (skip last week) volatility-adjusted performers in confirmed uptrends, rebalanced weekly, never held through earnings, ${(mom.trailing_stop * 100).toFixed(0)}% trailing stop; news can only veto.</li>
      <li>Leftover cash goes into SPY while the regime is risk-on.</li>
    </ul>
    <h3>Risk controls (both books)</h3>
    <ul><li>Drawdown ≥${(risk.drawdown_pause * 100).toFixed(0)}% from peak: no new stock entries for ${risk.pause_sessions} sessions. Drawdown ≥${(risk.drawdown_halt * 100).toFixed(0)}%: liquidate and hold cash for ${risk.halt_sessions} sessions (the rest of the experiment).</li>
      <li>No leverage, short selling or options. Fractional shares to 6 decimals. Minimum order $${port.min_order_usd}.</li></ul>
    <h3>Execution realism</h3>
    <ul><li>Decisions use only data available at decision time; every fill uses a price observed after the decision: the official open for orders placed before the open, otherwise the open of the next 5-minute bar.</li>
      <li>Costs per side: SPY ${c.etf_bps} bp; stocks ${c.stock_bps_adv_ge_1b}–${c.stock_bps_other} bp by liquidity; +${c.open_auction_extra_bps} bp at the open; +${c.stop_fill_extra_bps} bp on stop fills; SEC fee on sells.</li>
      <li>Stops are standing orders, as at a real broker, including while the Mac is asleep; they are processed from market data when the Mac is back online. New decisions only happen while the Mac is on.</li>
      <li>Stale or missing data means no trade. Missing official closes are rebuilt from 5-minute bars and flagged.</li></ul>
    <h3>What this can't tell you</h3>
    <p>One month is about 21 trading sessions. Historically, a single month's return relative to SPY varied by roughly ±4 percentage points (1 s.d.) for this kind of strategy, so no result here, good or bad, is evidence of a lasting edge. This is a research experiment, not investment advice.</p></div>`;
}

function render(){
  if (!S.state) return;
  renderNav(); renderTop(); renderBanners();
  ({home: viewHome, feed: viewFeed, own: viewOwn, how: viewHow, overview: viewOverview, holdings: viewHoldings, activity: viewActivity, decisions: viewDecisions, reports: viewReports, backtest: viewBacktest, system: viewSystem, method: viewMethod}[S.view] || viewHome)();
  $('#gen').textContent = 'Updated ' + ago(S.state.generated_at);
  const v = $('#view');
  if (S.entering){ v.classList.remove('enter'); void v.offsetWidth; v.classList.add('enter');
    document.querySelectorAll('.chart path.anim').forEach(p => { try { p.style.setProperty('--len', Math.ceil(p.getTotalLength())); } catch(e){} }); }
  S.entering = false;
  animateValues();
}
async function load(){
  if (LIVE){
    try { S.state = await (await fetch('/api/state', {cache: 'no-store'})).json(); soundForNew(S.state); }
    catch(e){ toast('Could not reach the local server.'); return; }
  }
  render();
}
(function(){ const t = localGet('theme'); if (t) document.documentElement.dataset.theme = t; })();
S.entering = true;
load();
if (LIVE) setInterval(() => { if (!document.hidden && !document.querySelector('#q:focus')) load(); }, 15000);
let rz; addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(render, 150); });
</script>
</body>
</html>
