name: cycle
# Paper trading only. Runs the experiment on GitHub's servers so it works while the Mac is off.
# Times are UTC; the experiment (Sep 23 - Oct 22, 2026) is entirely within US daylight time (ET = UTC-4).
on:
  schedule:
    - cron: "*/15 13-19 * * 1-5" # every 15 min, 09:00-15:45 ET (day-trading book + fills/stops)
    - cron: "7 20 * * 1-5"       # 16:07 ET  day-trading close-out
    - cron: "37 20 * * 1-5"      # 16:37 ET  daily books: close-out + decision for the next open
    - cron: "11 21 * * 1-5"      # 17:11 ET  backup (scheduled runs can be delayed or dropped)
    - cron: "13 23 * * 1-5"      # 19:13 ET  backup
    - cron: "43 0-12,21-23 * * *" # hourly overnight, every day (prediction-market bot trades crypto 24/7)
    - cron: "43 13-20 * * 0,6"    # hourly on weekends during the day
  workflow_dispatch:
concurrency:
  group: cycle
  cancel-in-progress: false
permissions:
  contents: write
  issues: write
  actions: write # lets a session run start its successor
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test before trading
        run: python -m pytest -q
      - name: Restore market-data cache
        uses: actions/cache/restore@v4
        with:
          path: data/market_cache.sqlite
          key: market-${{ github.run_id }}
          restore-keys: market-
      - name: Restore ledgers from state/
        run: python -m papertrader.statesync restore --force
      - name: Verify integrity (audit chain, frozen strategy hashes, cash)
        run: python run.py verify
      - name: Run one cycle
        id: cycle
        run: |
          ls reports/day*.json 2>/dev/null | sort > /tmp/reports_before || true
          # Inside the weekday morning window this loops every 5 min for ~20 min (papertrader/session.py); otherwise one cycle.
          python -m papertrader.session loop
          ls reports/day*.json 2>/dev/null | sort > /tmp/reports_after || true
      # Only after the cycle step ran: a failed test/restore/verify must never dump absent or unverified ledgers over state/.
      - name: Save ledgers to state/
        if: always() && steps.cycle.conclusion != 'skipped'
        run: python -m papertrader.statesync dump
      - name: Save market-data cache
        if: always() && steps.cycle.conclusion != 'skipped'
        uses: actions/cache/save@v4
        with:
          path: data/market_cache.sqlite
          key: market-${{ github.run_id }}
      - name: Commit state and reports
        if: always() && steps.cycle.conclusion != 'skipped'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state reports
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -q -m "cycle $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && exit 0; sleep 5; done
          exit 1
      - name: Announce new reports (GitHub emails you about new issues)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          comm -13 /tmp/reports_before /tmp/reports_after 2>/dev/null | while read f; do
            md="${f%.json}.md"
            day=$(python -c "import json;print(json.load(open('$f'))['day'])")
            head -c 60000 "$md" > /tmp/body.md
            gh issue create --title "Paper Trader: Day $day report" --body-file /tmp/body.md || true
          done
      # GitHub delivers only a few of the cron slots, so in the morning window each successful run starts the next one.
      # Only after success (a failing run must not hot-loop); concurrency keeps at most one pending run, so chains merge.
      - name: Continue the trading-window session
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python -m papertrader.session chain; then gh workflow run cycle.yml || echo "could not start the next run; cron takes over"; else echo "outside the window; cron takes over"; fi
